<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>Forgot Password</h2>
    <input type="text" id="forgotUser" placeholder="Enter Username or Email"><br>
    <button id="fetchQuestionBtn">Next</button><br>

    <!-- Hidden by default -->
    <div id="securitySection" style="display:none;">
        <p id="securityQuestion"></p>
        <input type="text" id="securityAnswer" placeholder="Your Answer"><br>
        <input type="password" id="newPassword" placeholder="New Password"><br>
        <button id="resetPasswordBtn">Reset Password</button>
    </div>

    <p><a href="login.html">Back to Login</a></p>

    <script src="https://cdn.jsdelivr.net/npm/jsencrypt/bin/jsencrypt.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forgot.js"></script>
</body>
</html>
