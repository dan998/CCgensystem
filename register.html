<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>Register</h2>
    <input type="text" id="regUsername" placeholder="Username"><br>
    <input type="email" id="regEmail" placeholder="Gmail"><br>
    <input type="text" id="regPhone" placeholder="Phone Number"><br>
    <input type="password" id="regPassword" placeholder="Password"><br>
    <input type="text" id="regSecurityQ" placeholder="Security Question"><br>
    <input type="text" id="regSecurityA" placeholder="Answer"><br>
    <input type="text" id="regReferral" placeholder="Referral Code (Optional)"><br>
    <button id="registerBtn">Register</button>
    <p><a href="login.html">Already have an account? Login</a></p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0/jsencrypt.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
