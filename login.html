<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V.I.P Cyber Access</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">

        <h2 class="neon-title">V.I.P Access</h2>

        <div class="login-box">

            <label>Username or Email</label>
            <input type="text" id="usernameInput" placeholder="Enter username">

            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="Enter password">
                <span id="showPassword" class="toggle-eye">👁️</span>
            </div>

            <p id="errorMessages"></p>

            <button id="checkAccessButton">Login</button>

            <a href="register.html" class="small-link">Create Account</a>
            <a href="forgot.html" class="small-link">Forgot Password?</a>

        </div>
    </div>

    <script src="profile-sync.js"></script>
    <script src="script.js"></script>

</body>
</html>
