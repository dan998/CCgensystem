<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Forget Password</h2>
        <header>
            <button id="backButton" class="back-button">Back to Login</button>
        </header>
        <div id="usernameOrEmailContainer">
            <label for="usernameOrEmailInput">Username or Email:</label><br>
            <input type="text" id="usernameOrEmailInput">
            <br>
            <button id="submitUsernameOrEmail">Submit</button>
        </div>
        <div id="securityQuestionContainer" style="display: none;">
            <label for="securityQuestion">Security Question:</label><br>
            <p id="securityQuestion"></p>
            <br>
            <label for="securityAnswer">Security Answer:</label><br>
            <input type="text" id="securityAnswer">
            <br>
            <br>
            <br>
            <button id="submitSecurityAnswer">Submit</button>
        </div>
        <p id="errorMessages"></p>
        <p id="passwordDisplay"></p>
    </div>

    <!-- Popup Form -->
    <div id="popup-form" class="popup">
        <div class="popup-content">
            <span class="close" id="close-popup">&times;</span>
            <h2>Enter Your Phone Number</h2>
            <p>Submit your username or email, and a correct phone number with<b style="font-color: red"> + area code</b>, and we will get back to you in 24hrs for resetting your password.</p>
            <form id="phone-form">
                <!-- Update your HTML -->
                <label for="usernameOrEmailInputPopup">Username or Email:</label><br>
                <input type="text" id="usernameOrEmailInputPopup" placeholder="Username or Email" required><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="+592*******" required><br>

                <button type="submit">Submit</button>
            </form>
               <script src="profile-sync.js"></script>
     <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=c5vpz362&n=n1.ratufa.io"></script>
        </div>
    </body>
    </html>

    <script src="forget_password.js"></script>
</body>
</html>
